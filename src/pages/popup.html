<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeZone Converter</title>
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo">
        <img src="../icons/icon32.png" alt="TimeZone Converter">
        <h1>TimeZone Converter</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Quick Controls -->
    <div class="quick-controls">
      <label class="toggle-control">
        <input type="checkbox" id="highlightToggle" checked>
        <span class="toggle-slider"></span>
        <span class="toggle-label">Highlight</span>
      </label>
      <button id="ignoreBtn" class="btn-icon" title="Ignore this site">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
      </button>
      <button id="rescanBtn" class="btn-icon" title="Rescan">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>

    <!-- Ignored sites -->
    <div class="ignored-panel" id="ignoredPanel">
      <div class="ignored-header">
        <span class="ignored-title">Ignored</span>
        <span class="ignored-current" id="currentDomain">—</span>
        <button class="ignored-toggle" id="ignoredToggleBtn" type="button">Ignore</button>
      </div>
      <div class="ignored-list" id="ignoredList" aria-label="Ignored sites list"></div>
    </div>

    <!-- Times List -->
    <div class="times-section">
      <div class="times-header">
        <span class="times-count" id="timesCount">0</span>
        <span class="times-label">times found</span>
        <span class="times-status" id="timesStatus" title="Content script connection status">checking…</span>
      </div>
      
      <div class="times-list" id="timesList">
        <div class="empty-state" id="emptyState">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <p>No times found</p>
          <p class="empty-hint" id="emptyHint">Open a webpage with times like “8PM CET” and press Rescan.</p>
        </div>
      </div>
    </div>

    <!-- Support -->
    <footer class="popup-footer">
      <div class="support-row">
        <button id="supportBtn" class="support-btn" type="button" title="Support the developer">
          <span class="support-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/>
            </svg>
          </span>
          Buy Me a Coffee
        </button>

        <button id="kofiBtn" class="support-btn kofi-btn" type="button" title="Support on Ko-fi">
          <span class="support-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 21s-6.716-4.35-9.192-8.11C.936 9.73 2.08 6.5 5.4 6.5c1.733 0 3.043.93 3.86 2.02.817-1.09 2.127-2.02 3.86-2.02 3.32 0 4.464 3.23 2.592 6.39C18.716 16.65 12 21 12 21z"/>
            </svg>
          </span>
          Ko-fi
        </button>
      </div>

      <button id="githubBtn" class="github-btn" type="button" title="Open GitHub (feedback & issues)">
        <span class="support-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.18-3.37-1.18-.45-1.15-1.11-1.46-1.11-1.46-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.36 1.09 2.93.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.85-2.34 4.7-4.57 4.95.36.31.68.92.68 1.86v2.75c0 .26.18.57.69.48A10 10 0 0 0 12 2z"/>
          </svg>
        </span>
        GitHub / Feedback
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
